# Kênh sàn: Shopee cấm điều hướng giao dịch ra ngoài sàn (link, SĐT, nhắc kênh khác).
# BẢN NHÁP - cần đối chiếu quy định người bán Shopee hiện hành trước khi dùng thật.
channel: SHOPEE
display_name: Shopee
owned: false
max_length: 1000
rules:
  - id: no-external-link
    description: Không gửi link ra ngoài sàn
    pattern: '(https?://|www\.)\S+'
    action: redact
  - id: no-phone
    description: Không cho/xin số điện thoại
    pattern: '(\+?84|0)([\s.\-]?\d){8,10}'
    action: redact
  - id: no-other-channel
    description: Không nhắc tới kênh bán/liên hệ khác
    pattern: '\b(tiktok|lazada|tiki|zalo|facebook|messenger|telegram|website|trang web|web của shop|web shop)\b'
    action: block
fallback_message: "Dạ, shop xin phép tư vấn trong phạm vi Shopee ạ. Bạn có thể xem voucher của shop và khung giờ Flash Sale ngay trên trang Shopee của shop nhé!"
