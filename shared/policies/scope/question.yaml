# Phạm vi câu hỏi khách gửi cho trợ lý shop mỹ phẩm.
# Nằm trong thư mục con để PolicyEngine và bench không nạp nhầm thành luật kênh.
# Brain đọc file này trước khi gọi LLM. Chỉ từ chối khi câu khớp một luật refuse.
# Câu tư vấn shop không cần khớp từ khóa vẫn được đi tiếp.
fallback_message: "Dạ, mình chỉ tư vấn mỹ phẩm trong shop thôi ạ. Bạn hỏi về loại da, sản phẩm, cách dùng, giá hoặc còn hàng giúp mình nhé."
refuse:
  - id: math
    description: Phép tính hoặc bài toán, không phải câu hỏi về sản phẩm.
    pattern: '(?<!\d)\d+(?:[.,]\d+)?\s*(?:\+|×|\*|x|÷|\^|cộng|trừ|nhân|chia)\s*\d+|\b(phương trình|đạo hàm|tích phân|giải toán|bài toán|căn bậc)\b'
  - id: programming
    description: Lập trình.
    pattern: '(lập trình|viết code|viết chương trình|ngôn ngữ lập trình|thuật toán|\bpython\b|\bjavascript\b|\btypescript\b|\bjava\b|\bhtml\b|\bcss\b|\bsql\b|\breact\b|c\+\+|\bdebug\b)'
  - id: literature
    description: Văn học.
    pattern: '(văn học|tiểu thuyết|nhà văn|nhà thơ|làm thơ|viết thơ|bài thơ|truyện kiều)'
  - id: philosophy
    description: Triết học.
    pattern: '(triết học|triết gia|siêu hình)'
  - id: history
    description: Sử học.
    pattern: '(sử học|lịch sử)'
  - id: geography
    description: Địa lý.
    pattern: '(địa lý|thủ đô|châu lục|bán cầu|kinh tuyến|vĩ tuyến|bản đồ|(?:sông|núi|biển|đảo) nào)'
  - id: other-subject
    description: Chủ đề ngoài mỹ phẩm khác.
    pattern: '(thời tiết|bóng đá|world cup|dịch sang|dịch hộ|giá vàng|chứng khoán|bitcoin)'
