spring:
  application:
    name: omniai-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/omniai}
    username: ${DB_USERNAME:omniai}
    password: ${DB_PASSWORD:omniai}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

omniai:
  policy-dir: ${OMNIAI_POLICY_DIR:../shared/policies}
  brain:
    url: ${BRAIN_URL:http://localhost:8000}
    timeout: 10s
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173}
