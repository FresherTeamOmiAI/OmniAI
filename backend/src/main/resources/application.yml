spring:
  application:
    name: omniai-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/omniai}
    username: ${DB_USERNAME:omniai}
    password: ${DB_PASSWORD:omniai}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

omniai:
  policy-dir: ${OMNIAI_POLICY_DIR:../shared/policies}
  brain:
    url: ${BRAIN_URL:http://localhost:8000}
    timeout: 10s
  chatbot-db-password: ${CHATBOT_DB_PASSWORD:}
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173}
  # Tài khoản admin tạm cho /api/admin/** (HTTP Basic, SRS Q-01). admin/admin chỉ dùng khi dev.
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  # Ảnh sản phẩm trên Supabase Storage (decisions #26). Backend chỉ ghép URL public, không cần khoá service.
  # SUPABASE_URL trống thì imageUrl = null (web hiện khung trống).
  images:
    base-url: ${SUPABASE_URL:}
    bucket: ${SUPABASE_BUCKET:product-images}
