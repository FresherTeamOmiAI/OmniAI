spring:
  application:
    name: omniai-backend
  # Mặc định: Postgres Docker local. Dùng Postgres trên Supabase: SPRING_PROFILES_ACTIVE=supabase
  # (application-supabase.yml đọc SUPABASE_DB_*, decisions #33).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/omniai}
    username: ${DB_USERNAME:omniai}
    password: ${DB_PASSWORD:omniai}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

omniai:
  policy-dir: ${OMNIAI_POLICY_DIR:../shared/policies}
  brain:
    url: ${BRAIN_URL:http://localhost:8000}
    timeout: 30s
  chatbot-db-password: ${CHATBOT_DB_PASSWORD:}
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173}
  # Tài khoản admin tạm cho /api/admin/** (HTTP Basic, SRS Q-01). admin/admin chỉ dùng khi dev.
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  # Khóa test của simulator Shopee. Không dùng khóa sàn thật.
  channels:
    shopee:
      partner-id: ${SHOPEE_PARTNER_ID:2000001}
      partner-key: ${SHOPEE_PARTNER_KEY:test-partner-key}
      shop-id: ${SHOPEE_SHOP_ID:10001}
      access-token: ${SHOPEE_ACCESS_TOKEN:test-access-token}
      push-callback-url: ${SHOPEE_PUSH_CALLBACK_URL:http://127.0.0.1:8080/api/channels/shopee/push}
      datasource:
        url: ${SHOPEE_DB_URL:jdbc:postgresql://localhost:5432/shopee}
        username: ${SHOPEE_DB_USERNAME:omniai}
        password: ${SHOPEE_DB_PASSWORD:omniai}
  # Kênh TikTok Shop (US-25). S2 trỏ tới simulator simulators/tiktok-shop (decisions #22, #28).
  # Khóa app phải trùng với simulator; giá trị mặc định là khóa test, không phải bí mật.
  tiktok:
    app-key: ${TIKTOK_APP_KEY:omniai-test-app}
    app-secret: ${TIKTOK_APP_SECRET:omniai-test-secret}
    base-url: ${TIKTOK_SIM_URL:http://localhost:8090}
    redirect-uri: ${TIKTOK_REDIRECT_URI:http://localhost:8080/api/channels/tiktok/oauth/callback}
    webhook-url: ${TIKTOK_WEBHOOK_URL:http://localhost:8080/api/channels/tiktok/webhook}
    webhook-max-skew: 5m
    max-concurrent: 40
    timeout: 10s
  # Đồng bộ sản phẩm hub -> sàn (US-49, T-49.1). Chỉ gửi ra kênh có connector; S3 chưa có connector nào (Shopee sau T-49.2).
  sync:
    enabled: ${SYNC_ENABLED:true}
    poll-interval-ms: 1000
    max-attempts: 4
    retry-backoff: 2s
  # Ảnh sản phẩm trên Supabase Storage (decisions #26). Backend chỉ ghép URL public, không cần khoá service.
  # SUPABASE_URL trống thì imageUrl = null (web hiện khung trống).
  images:
    base-url: ${SUPABASE_URL:}
    bucket: ${SUPABASE_BUCKET:product-images}
