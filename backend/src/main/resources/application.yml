spring:
  application:
    name: omniai-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/omniai}
    username: ${DB_USERNAME:omniai}
    password: ${DB_PASSWORD:omniai}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

omniai:
  policy-dir: ${OMNIAI_POLICY_DIR:../shared/policies}
  brain:
    url: ${BRAIN_URL:http://localhost:8000}
    timeout: 10s
  chatbot-db-password: ${CHATBOT_DB_PASSWORD:}
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173}
  # Tài khoản admin tạm cho /api/admin/** (HTTP Basic, SRS Q-01). admin/admin chỉ dùng khi dev.
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  # Kênh TikTok Shop (US-25). S2 trỏ tới simulator simulators/tiktok-shop (decisions #22, #28).
  # Khóa app phải trùng với simulator; giá trị mặc định là khóa test, không phải bí mật.
  tiktok:
    app-key: ${TIKTOK_APP_KEY:omniai-test-app}
    app-secret: ${TIKTOK_APP_SECRET:omniai-test-secret}
    base-url: ${TIKTOK_SIM_URL:http://localhost:8090}
    redirect-uri: ${TIKTOK_REDIRECT_URI:http://localhost:8080/api/channels/tiktok/oauth/callback}
    webhook-url: ${TIKTOK_WEBHOOK_URL:http://localhost:8080/api/channels/tiktok/webhook}
    webhook-max-skew: 5m
    max-concurrent: 40
    timeout: 10s
